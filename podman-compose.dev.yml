version: "3.9"

services:
  app:
    build: .
    image: local/eventsmap-backend:dev
    container_name: em-backend-dev
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:devkeyplaceholder
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: eventsmap
      DB_USERNAME: eventsmap
      DB_PASSWORD: secret
    volumes:
      - ./:/var/www
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4
    container_name: em-postgres-dev
    environment:
      POSTGRES_DB: eventsmap
      POSTGRES_USER: eventsmap
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
