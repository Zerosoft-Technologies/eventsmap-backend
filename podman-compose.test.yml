version: "3.9"

services:
  backend:
    image: ghcr.io/zerosoft-technologies/eventsmap-backend:${IMAGE_TAG}
    container_name: eventsmap-backend-test
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "4001:8000"

  db:
    image: docker.io/postgis/postgis:16-3.4
    container_name: eventsmap-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventsmap
      POSTGRES_USER: eventsmap
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data

volumes:
  pgdata_test:
